apiVersion: v1
kind: Namespace
metadata:
  name: governance
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-pipeline
  namespace: governance
  annotations:
    eks.amazonaws.com/role-arn: REPLACE_WITH_TERRAFORM_WORKLOAD_ROLE_ARN
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: governance-config
  namespace: governance
data:
  KAFKA_BOOTSTRAP_SERVERS: REPLACE_WITH_MSK_IAM_BOOTSTRAP_BROKERS
  KAFKA_SECURITY_PROTOCOL: SASL_SSL
  KAFKA_SASL_MECHANISM: AWS_MSK_IAM
  KAFKA_INTERNAL_REPLICATION_FACTOR: "3"
  AWS_REGION: ap-south-1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-rule-engine
  namespace: governance
spec:
  replicas: 3
  selector:
    matchLabels: {app: governance-rule-engine}
  template:
    metadata:
      labels: {app: governance-rule-engine}
    spec:
      serviceAccountName: governance-pipeline
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: rule-engine
          image: REPLACE_WITH_STREAM_PROCESSOR_ECR_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: governance-config}
          env:
            - {name: KAFKA_STREAM_THREADS, value: "2"}
            - {name: KAFKA_STATE_DIR, value: /var/lib/kafka-streams}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          volumeMounts:
            - {name: state, mountPath: /var/lib/kafka-streams}
          livenessProbe:
            exec: {command: ["sh", "-c", "kill -0 1"]}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            exec: {command: ["sh", "-c", "kill -0 1"]}
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: state
          emptyDir: {}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: governance-rule-engine
  namespace: governance
spec:
  minAvailable: 2
  selector:
    matchLabels: {app: governance-rule-engine}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: governance-rule-engine
  namespace: governance
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: governance-rule-engine
  minReplicas: 3
  maxReplicas: 6
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-risk-scorer
  namespace: governance
spec:
  replicas: 1
  selector:
    matchLabels: {app: governance-risk-scorer}
  template:
    metadata:
      labels: {app: governance-risk-scorer}
    spec:
      serviceAccountName: governance-pipeline
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: risk-scorer
          image: REPLACE_WITH_RISK_SCORER_ECR_IMAGE
          envFrom:
            - configMapRef: {name: governance-config}
          env:
            - {name: RISK_MODEL_MIN_SAMPLES, value: "32"}
            - {name: RISK_MODEL_RETRAIN_EVERY, value: "25"}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: governance-postgres-sink
  namespace: governance
spec:
  replicas: 2
  selector:
    matchLabels: {app: governance-postgres-sink}
  template:
    metadata:
      labels: {app: governance-postgres-sink}
    spec:
      serviceAccountName: governance-pipeline
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres-sink
          image: REPLACE_WITH_POSTGRES_SINK_ECR_IMAGE
          envFrom:
            - configMapRef: {name: governance-config}
          env:
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef: {name: governance-database, key: dsn}
          resources:
            requests: {cpu: 200m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}

