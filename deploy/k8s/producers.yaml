    spec: {selector: {app: llm-gateway-adapter}, ports: [{name: http, port: 80, targetPort: http}]}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: llm-gateway-adapter, namespace: governance}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: llm-gateway-adapter}
      minReplicas: 2
      maxReplicas: 6
      metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
