apiVersion: v1
kind: List
items:
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: keycloak-adapter
      namespace: governance
      annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_KEYCLOAK_ADAPTER_ROLE_ARN}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: kubernetes-audit-adapter
      namespace: governance
      annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_KUBERNETES_AUDIT_ADAPTER_ROLE_ARN}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: airflow-openlineage-adapter
      namespace: governance
      annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_AIRFLOW_OPENLINEAGE_ADAPTER_ROLE_ARN}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: model-registry-adapter
      namespace: governance
      annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_MODEL_REGISTRY_ADAPTER_ROLE_ARN}
  - apiVersion: v1
    kind: ServiceAccount
    metadata:
      name: llm-gateway-adapter
      namespace: governance
      annotations: {eks.amazonaws.com/role-arn: REPLACE_WITH_LLM_GATEWAY_ADAPTER_ROLE_ARN}

  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: keycloak-adapter, namespace: governance}
    spec:
      replicas: 2
      selector: {matchLabels: {app: keycloak-adapter}}
      template:
        metadata: {labels: {app: keycloak-adapter}}
        spec:
          serviceAccountName: keycloak-adapter
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: adapter
              image: REPLACE_WITH_KEYCLOAK_ADAPTER_ECR_IMAGE
              envFrom: [{configMapRef: {name: governance-config}}]
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5}
              livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  - apiVersion: v1
    kind: Service
    metadata: {name: keycloak-adapter, namespace: governance}
    spec: {selector: {app: keycloak-adapter}, ports: [{name: http, port: 80, targetPort: http}]}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: keycloak-adapter, namespace: governance}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: keycloak-adapter}
      minReplicas: 2
      maxReplicas: 6
      metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: kubernetes-audit-adapter, namespace: governance}
    spec:
      replicas: 2
      selector: {matchLabels: {app: kubernetes-audit-adapter}}
      template:
        metadata: {labels: {app: kubernetes-audit-adapter}}
        spec:
          serviceAccountName: kubernetes-audit-adapter
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: adapter
              image: REPLACE_WITH_KUBERNETES_AUDIT_ADAPTER_ECR_IMAGE
              envFrom: [{configMapRef: {name: governance-config}}]
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5}
              livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  - apiVersion: v1
    kind: Service
    metadata: {name: kubernetes-audit-adapter, namespace: governance}
    spec: {selector: {app: kubernetes-audit-adapter}, ports: [{name: http, port: 80, targetPort: http}]}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: kubernetes-audit-adapter, namespace: governance}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: kubernetes-audit-adapter}
      minReplicas: 2
      maxReplicas: 6
      metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: airflow-openlineage-adapter, namespace: governance}
    spec:
      replicas: 2
      selector: {matchLabels: {app: airflow-openlineage-adapter}}
      template:
        metadata: {labels: {app: airflow-openlineage-adapter}}
        spec:
          serviceAccountName: airflow-openlineage-adapter
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: adapter
              image: REPLACE_WITH_AIRFLOW_OPENLINEAGE_ADAPTER_ECR_IMAGE
              envFrom: [{configMapRef: {name: governance-config}}]
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5}
              livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  - apiVersion: v1
    kind: Service
    metadata: {name: airflow-openlineage-adapter, namespace: governance}
    spec: {selector: {app: airflow-openlineage-adapter}, ports: [{name: http, port: 80, targetPort: http}]}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: airflow-openlineage-adapter, namespace: governance}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: airflow-openlineage-adapter}
      minReplicas: 2
      maxReplicas: 6
      metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: model-registry-adapter, namespace: governance}
    spec:
      replicas: 2
      selector: {matchLabels: {app: model-registry-adapter}}
      template:
        metadata: {labels: {app: model-registry-adapter}}
        spec:
          serviceAccountName: model-registry-adapter
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: adapter
              image: REPLACE_WITH_MODEL_REGISTRY_ADAPTER_ECR_IMAGE
              envFrom: [{configMapRef: {name: governance-config}}]
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5}
              livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  - apiVersion: v1
    kind: Service
    metadata: {name: model-registry-adapter, namespace: governance}
    spec: {selector: {app: model-registry-adapter}, ports: [{name: http, port: 80, targetPort: http}]}
  - apiVersion: autoscaling/v2
    kind: HorizontalPodAutoscaler
    metadata: {name: model-registry-adapter, namespace: governance}
    spec:
      scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: model-registry-adapter}
      minReplicas: 2
      maxReplicas: 6
      metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]

  - apiVersion: apps/v1
    kind: Deployment
    metadata: {name: llm-gateway-adapter, namespace: governance}
    spec:
      replicas: 2
      selector: {matchLabels: {app: llm-gateway-adapter}}
      template:
        metadata: {labels: {app: llm-gateway-adapter}}
        spec:
          serviceAccountName: llm-gateway-adapter
          securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: adapter
              image: REPLACE_WITH_LLM_GATEWAY_ADAPTER_ECR_IMAGE
              envFrom: [{configMapRef: {name: governance-config}}]
              ports: [{name: http, containerPort: 8080}]
              readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 5}
              livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 15}
              resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 384Mi}}
  - apiVersion: v1
